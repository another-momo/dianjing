name: Release

# tag 触发（v*）：打包重且慢（Electron ~100MB 下载 + 产物 114MB），日常 push
# 不跑。产物只存 workflow artifact（owner 2026-09-07 拍板）——正式发版策略
# （GitHub Release / 版本节奏）等 rebrand 后再定。
on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-windows:
    name: Windows NSIS installer
    timeout-minutes: 30
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-bun

      # tag 与 package.json version 必须一致——electron-builder 的产物名取
      # 后者，不一致会让 artifact 名与 tag 脱钩。允许 v<version>-<后缀>
      # 形式（v0.14.0-ci.1 这类预发/演练 tag），比较时剥掉后缀
      - name: Verify tag matches package.json version
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          BASE="${TAG%%-*}"
          PKG=$(bun -e 'console.log(JSON.parse(await Bun.file("package.json").text()).version)')
          echo "tag=$TAG base=$BASE package=$PKG"
          if [ "$BASE" != "$PKG" ]; then
            echo "::error::tag v$TAG（基版本 $BASE）与 package.json version $PKG 不一致"
            exit 1
          fi

      # package:win = build:packages + vite build + stage:native-externals +
      # electron-builder --win nsis。脚本内烤死 npmmirror 镜像 env（本机
      # github 不通的纪律），CI 上 github 本可直连，但保持同一条链不 diverge
      - name: Build NSIS installer
        run: bun run package:win

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Dianjing-Setup-${{ github.ref_name }}
          path: |
            release/Dianjing-Setup-*.exe
            release/Dianjing-Setup-*.exe.blockmap
          # 命名漂移（如 productName 再改）必须炸红——默认 warn 会绿着产出
          # 无产物 run（2026-09-15 OpenPencil→Dianjing 漂移实证）
          if-no-files-found: error
          retention-days: 30
