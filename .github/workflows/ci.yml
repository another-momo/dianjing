name: CI

on:
  push:
    branches: ['rebuild/**', 'merge/**', 'spike/**']
  pull_request:
    branches: [master]
    paths-ignore:
      - 'packages/docs/**'
      - 'openspec/**'
      - '*.md'

permissions:
  contents: read
  packages: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-quality:
    name: Code quality
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-bun

      - name: Generate package declarations
        run: bun run build:packages

      - name: Verify formatting
        run: bun run format:check

      - name: Lint TypeScript and Vue
        run: bun run lint

      - name: Typecheck application and SDKs
        run: bun run typecheck

      - name: Enforce architecture and type-shape boundaries
        run: bun run check:arch && bun run test:type-shapes

  package-quality:
    name: Package integrity
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-bun

      - name: Build publishable packages
        run: bun run build:packages

      - name: Detect unused dependencies and files
        run: bun run check:deps

      - name: Validate workspace dependency policy
        run: bun run check:monorepo

  repository-quality:
    name: Repository hygiene
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-bun

      - name: Validate translations
        run: bun run check:i18n

      - name: Audit critical dependency vulnerabilities
        run: bun run check:audit

      - name: Scan for committed secrets
        run: bun run check:secrets

      - name: Test repository tooling
        run: bun run test:tools

      - name: Detect duplicated product code
        run: bun run test:dupes

  # Fork-owned governance checks (docs/rebuild discipline + zone registry).
  # P32: these were documented as CI-enforced since Phase 0 but were never
  # actually wired — T09 retrofit. Scripts use only node builtins, so no
  # bun install is needed; check:zones needs upstream/master for merge-base.
  rebuild-discipline:
    name: Rebuild discipline
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2

      - name: Fetch upstream for zone-check merge-base
        run: |
          git remote add upstream https://github.com/open-pencil/open-pencil.git
          git fetch --no-tags upstream master

      # T64（owner 2026-09-01 拍板）：本步骤只跑静态 base-diff 规则；GHOST /
      # PATCH_TARGET_DELETED_UPSTREAM 等上游活动窗口规则 = 外生移动靶，由下方
      # upstream-drift 非阻断 job 承载（2026-09-05 方案 §5.1 去 cron 化）
      - name: Zone registry purity
        run: bun run check:zones

      # docs/rebuild moved to docs/archive/rebuild-campaign (frozen 2026-09-06);
      # check:docs and tasks.ts no longer exist. bindings.ts is kept here as the
      # sole docs-related governance check — it walks the archived tree and
      # remains relevant for the binding discipline until retired separately.
      - name: Narrative bindings
        shell: bash
        run: |
          BASE="${{ github.event.before || github.event.pull_request.base.sha || 'HEAD~1' }}"
          if [ "$BASE" = "0000000000000000000000000000000000000000" ]; then BASE="HEAD~1"; fi
          echo "diff base: $BASE"
          bun tools/zone-registry/src/check/bindings.ts --base "$BASE"

  # 上游 drift 雷达（2026-09-05 分区优化方案 §5.1 去 cron 化）：nightly cron 从未
  # 运行过（cron 只在默认分支生效，fork 默认分支无该 workflow），改为借用日常
  # push 节奏的非阻断 job——只在 push 到 rebuild/** 时跑，continue-on-error 不挡
  # 门禁，输出可见即可；--drift 全绿列为合并 SOP（docs/rebuild/04 §6）强制前置。
  upstream-drift:
    name: Upstream drift radar (non-blocking)
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/rebuild/')
    continue-on-error: true
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2

      - name: Fetch upstream for drift window
        run: |
          git remote add upstream https://github.com/open-pencil/open-pencil.git
          git fetch --no-tags upstream master

      - name: Zone drift radar (GHOST + PATCH_TARGET_DELETED_UPSTREAM)
        run: bun run check:zones --drift

  # T28 (决策单 #12): pi 后端契约测试进 CI——smoke:pi 五套件自含（tempRoot
  # 合成 JSONL/index fixture + standalone 后端 token 文件 + GC 超阈值/超龄归档），
  # 无需 LLM key / 浏览器 / 7600 桥 / dev server；bun 直跑 TS 源（tools.ts 等
  # 经 bun runtime 导入 src/app/ai/pi-backend/*，无需 build:packages）。
  pi-backend-contract:
    name: pi backend contract (smoke:pi)
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-bun

      - name: Run pi backend contract smokes
        run: bun run smoke:pi

  # T14 (P35, path updated T47): attic/dsh-workbench/ is a standalone-toolchain dsh bundle (not in bun
  # workspaces) — build it with its own npm lockfile and guard the X1
  # regression (raw JSX in client bundle breaks dsh module registration).
  # T15 (E2): the client bundle now inlines @open-pencil/core + @open-pencil/vue
  # via file: deps whose dist/ is NOT committed, and whose bare imports
  # (unifont, yoga-layout alias, …) resolve upward into the bun-installed
  # workspace tree — so the workspace must be installed + built first
  # (CI run 32575086061 failed on `Cannot find module 'unifont'` without it).
  workbench-build:
    name: Workbench bundle build
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-bun

      - name: Build workspace packages (core/vue dist for file deps)
        run: bun run build:packages

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build workbench bundle
        run: npm ci --no-audit --no-fund && npm run build
        working-directory: attic/dsh-workbench

      - name: X1 regression guard (no raw JSX in client bundle)
        shell: bash
        run: |
          grep -q "jsx-runtime" attic/dsh-workbench/lib/client.js
          ! grep -q "createPortal)(<" attic/dsh-workbench/lib/client.js
          head -c 200 attic/dsh-workbench/lib/client.js | grep -q "__ModuleLoader__.load"

  storybook:
    name: Component workshop
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-bun

      - name: Build component dependencies
        run: bun run build:packages

      - name: Build static Storybook
        run: bun run build-storybook

  unit-tests:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        group: [app, dom, editor, fig, render, scene, vue]
    name: Engine tests — ${{ matrix.group }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-bun
        with:
          lfs: 'true'

      - name: Build shared Core test dependency
        run: bun --filter @open-pencil/core build

      - name: Run ${{ matrix.group }} engine tests
        shell: bash
        run: |
          mapfile -t test_files < <(bun tools/unit-tests/src/list.ts "${{ matrix.group }}")
          if [ "${#test_files[@]}" -eq 0 ]; then
            echo "No tests found for shard ${{ matrix.group }}"
            exit 0
          fi
          # T91j：store.test.ts（fake-indexeddb）在多文件同进程下偶发事件投递
          # stall（run 33840822799/33844404386 实证：事件循环空闲挂满 watchdog，
          # bun 版本与测试规模均无相关变化）。拆独立进程跑——单进程从未复现
          # （本地 600ms 全绿），确定性消除 flake。
          solo_files=()
          batch_files=()
          for f in "${test_files[@]}"; do
            if [ "$f" = "tests/engine/app/document/recovery/store.test.ts" ]; then
              solo_files+=("$f")
            else
              batch_files+=("$f")
            fi
          done
          if [ "${#batch_files[@]}" -gt 0 ]; then
            bun test "${batch_files[@]}"
          fi
          if [ "${#solo_files[@]}" -gt 0 ]; then
            bun test "${solo_files[@]}"
          fi
        env:
          BUN_HEAVY_TESTS: 'false'
