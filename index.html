<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="128x128" href="/favicon-128.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#1e1e1e" />
    <title>点睛设计</title>
    <style>
      :root {
        --loader-bg: #1e1e1e;
        --loader-fg: 255, 255, 255;
      }
      @media (prefers-color-scheme: light) {
        :root {
          --loader-bg: #f3f4f6;
          --loader-fg: 32, 33, 36;
        }
      }
      html[data-theme='dark'] {
        --loader-bg: #1e1e1e;
        --loader-fg: 255, 255, 255;
      }
      html[data-theme='light'] {
        --loader-bg: #f3f4f6;
        --loader-fg: 32, 33, 36;
      }
      body { margin: 0; background: var(--loader-bg); }

      /* 启动过渡页：slogan 动效播完由 main.ts 加 boot-splash--exit 淡出移除。
         必须与 #app 同级——mount 会替换 #app 内部内容。 */
      #boot-splash {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        color: rgb(var(--loader-fg));
        background: var(--loader-bg);
      }
      #boot-splash.boot-splash--exit {
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.6s ease;
      }

      #boot-splash .scene {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 26px;
        padding: 0 32px;
        text-align: center;
      }

      /* 点睛 motif：杏仁眼廓一笔画出，瞳仁随后落定 + 涟漪——画龙点睛的定格。
         类名纪律：避让 Tailwind 工具类（`outline` 实测定撞——Tailwind 的
         outline-style:solid 会沿路径包围盒描出矩形框，2026-09-16 L3 实证）。 */
      #boot-splash .loong { width: 88px; height: 88px; overflow: visible; }
      #boot-splash .loong .eye-outline {
        stroke-dasharray: 230;
        stroke-dashoffset: 230;
        animation: draw 0.95s cubic-bezier(0.55, 0.06, 0.35, 1) 0.15s forwards;
      }
      #boot-splash .loong .pupil {
        transform: scale(0);
        transform-origin: 48px 48px;
        animation: dot 0.5s cubic-bezier(0.2, 0.9, 0.3, 1.25) 1.05s forwards;
      }
      #boot-splash .loong .ripple {
        opacity: 0;
        transform: scale(0.4);
        transform-origin: 48px 48px;
        animation: ripple 0.8s cubic-bezier(0.25, 0.6, 0.35, 1) 1.2s forwards;
      }
      @keyframes draw {
        to { stroke-dashoffset: 0; }
      }
      @keyframes dot {
        to { transform: scale(1); }
      }
      @keyframes ripple {
        0% { opacity: 0.45; transform: scale(0.4); }
        100% { opacity: 0; transform: scale(2.6); }
      }

      #boot-splash .slogan {
        margin: 0;
        max-width: 30em;
        font-family: Georgia, 'Times New Roman', 'Songti SC', serif;
        font-style: italic;
        font-size: 15px;
        line-height: 1.8;
        letter-spacing: 0.01em;
        color: rgba(var(--loader-fg), 0.82);
      }
      #boot-splash .slogan span {
        display: inline-block;
        opacity: 0;
        transform: translateY(5px);
        animation: rise 0.55s cubic-bezier(0.25, 0.6, 0.3, 1) forwards;
      }
      @keyframes rise {
        to { opacity: 1; transform: translateY(0); }
      }

      #boot-splash .mark {
        margin: 0;
        font-size: 11px;
        letter-spacing: 0.42em;
        text-indent: 0.42em; /* 视觉居中——末字不带的字距补回 */
        color: rgba(var(--loader-fg), 0.42);
        opacity: 0;
        animation: fadein 0.6s ease 1.5s forwards;
      }
      @keyframes fadein {
        to { opacity: 1; }
      }

      #boot-splash .bar {
        width: 100px;
        height: 2px;
        background: rgba(var(--loader-fg), 0.08);
        border-radius: 1px;
        overflow: hidden;
      }
      #boot-splash .bar::after {
        content: '';
        display: block;
        height: 100%;
        width: 40%;
        background: rgba(var(--loader-fg), 0.25);
        border-radius: 1px;
        animation: slide 1.1s ease-in-out infinite;
      }
      @keyframes slide {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(350%); }
      }

      @media (prefers-reduced-motion: reduce) {
        #boot-splash .loong .eye-outline { animation: none; stroke-dashoffset: 0; }
        #boot-splash .loong .pupil { animation: none; transform: scale(1); }
        #boot-splash .loong .ripple { animation: none; opacity: 0; }
        #boot-splash .slogan span { animation: none; opacity: 1; transform: none; }
        #boot-splash .mark { animation: none; opacity: 1; }
        #boot-splash .bar::after { animation: none; }
      }
    </style>
  </head>

  <body>
    <div id="app"></div>
    <div id="boot-splash">
      <div class="scene">
        <svg class="loong" viewBox="0 0 96 96" fill="none">
          <path
            class="eye-outline"
            d="M14 48 C 28 24, 68 24, 82 48 C 68 72, 28 72, 14 48 Z"
            stroke="rgba(var(--loader-fg), 0.85)"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
          <circle class="ripple" cx="48" cy="48" r="7" stroke="rgba(var(--loader-fg), 0.5)" stroke-width="1.5" />
          <circle class="pupil" cx="48" cy="48" r="6.5" fill="rgba(var(--loader-fg), 0.9)" />
        </svg>
        <p class="slogan" aria-label="AI can't paint a true loong without you to dot the eyes.">
          <span style="animation-delay:1.25s">AI</span>
          <span style="animation-delay:1.31s">can't</span>
          <span style="animation-delay:1.37s">paint</span>
          <span style="animation-delay:1.43s">a</span>
          <span style="animation-delay:1.47s">true</span>
          <span style="animation-delay:1.53s">loong</span>
          <span style="animation-delay:1.62s">without</span>
          <span style="animation-delay:1.69s">you</span>
          <span style="animation-delay:1.75s">to</span>
          <span style="animation-delay:1.80s">dot</span>
          <span style="animation-delay:1.86s">the</span>
          <span style="animation-delay:1.92s">eyes.</span>
        </p>
        <p class="mark">点睛设计</p>
        <div class="bar"></div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
