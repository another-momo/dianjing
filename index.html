<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="128x128" href="/favicon-128.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#1e1e1e" />
    <title>点睛设计</title>
    <style>
      :root {
        --loader-bg: #1e1e1e;
        --loader-fg: 255, 255, 255;
      }
      @media (prefers-color-scheme: light) {
        :root {
          --loader-bg: #f3f4f6;
          --loader-fg: 32, 33, 36;
        }
      }
      html[data-theme='dark'] {
        --loader-bg: #1e1e1e;
        --loader-fg: 255, 255, 255;
      }
      html[data-theme='light'] {
        --loader-bg: #f3f4f6;
        --loader-fg: 32, 33, 36;
      }
      body {
        margin: 0;
        background: var(--loader-bg);
      }

      /* 启动过渡页：动效从 HTML 解析即播（不挂类闸门）——opacity/transform 走
         合成器线程，bundle 求值阻塞主线程期间照常播放；Electron 产品形态窗口
         随创建即可见（show:true），播放与加载天然重叠。播完停在终态，直到
         main.ts 在首帧 rAF + 3100ms 加 boot-splash--exit 淡出移除。
         必须与 #app 同级——mount 会替换 #app 内部内容。
         动画写法：元素基态 = 终态，backwards fill 在 delay 期套用 0% 关键帧——
         reduced-motion 只需 animation:none 即自然落到完整终态。
         禁改类闸门延迟启动：加类瞬间会把已显示的终态拽回 0% 关键帧重播，
         用户看到「终态闪现 → 集体消失卡顿 → 重播」的双播效果。 */
      #boot-splash {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        color: rgb(var(--loader-fg));
        background: var(--loader-bg);
      }
      #boot-splash.boot-splash--exit {
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.6s ease;
      }

      #boot-splash .scene {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 28px;
        padding: 0 32px;
        text-align: center;
      }

      /* 品牌 logo 点睛：白瓷圆角砖落定 → 藏青光标浮起 → 青色环点弹出 → 涟漪。
         类名纪律：避让 Tailwind 工具类（`outline` 实测定撞——Tailwind 的
         outline-style:solid 会沿路径包围盒描出矩形框，2026-09-16 L3 实证；
         本批 `ring` 同为 Tailwind 工具类，故名 dot-ring）。 */
      #boot-splash .logo {
        width: 92px;
        height: 92px;
        filter: drop-shadow(0 8px 24px rgba(0, 0, 0, 0.28));
      }
      #boot-splash .logo-tile {
        animation: tilein 0.5s cubic-bezier(0.2, 0.8, 0.3, 1) backwards;
      }
      @keyframes tilein {
        from {
          opacity: 0;
          transform: scale(0.88);
        }
      }
      #boot-splash .cursor-arrow {
        animation: arrowin 0.45s cubic-bezier(0.25, 0.6, 0.3, 1) 0.25s backwards;
      }
      @keyframes arrowin {
        from {
          opacity: 0;
          transform: translateY(5px);
        }
      }
      #boot-splash .dot-ring {
        transform-origin: 77px 77px;
        animation: pop 0.5s cubic-bezier(0.2, 0.9, 0.3, 1.3) 0.6s backwards;
      }
      @keyframes pop {
        from {
          opacity: 0;
          transform: scale(0);
        }
      }
      #boot-splash .dot-ripple {
        transform-origin: 77px 77px;
        opacity: 0;
      }
      #boot-splash .dot-ripple {
        animation: dotripple 0.85s cubic-bezier(0.25, 0.6, 0.35, 1) 0.85s backwards;
      }
      @keyframes dotripple {
        0% {
          opacity: 0;
          transform: scale(0.9);
        }
        18% {
          opacity: 0.5;
        }
        100% {
          opacity: 0;
          transform: scale(1.9);
        }
      }

      #boot-splash .slogan {
        margin: 0;
        max-width: 30em;
        font-family: Inter, 'Segoe UI', system-ui, sans-serif;
        font-size: 21px;
        font-weight: 500;
        line-height: 1.75;
        letter-spacing: 0.012em;
        color: rgba(var(--loader-fg), 0.88);
      }
      #boot-splash .slogan span {
        display: inline-block;
        animation: rise 0.55s cubic-bezier(0.25, 0.6, 0.3, 1) backwards;
      }
      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(6px);
        }
      }
      #boot-splash .slogan .you {
        color: #22d3ee;
        font-weight: 700;
      }

      #boot-splash .mark {
        margin: 0;
        font-size: 11px;
        letter-spacing: 0.42em;
        text-indent: 0.42em; /* 视觉居中——末字不带的字距补回 */
        color: rgba(var(--loader-fg), 0.42);
      }
      #boot-splash .mark {
        animation: fadein 0.6s ease 1.9s backwards;
      }
      @keyframes fadein {
        from {
          opacity: 0;
        }
      }

      #boot-splash .bar {
        width: 100px;
        height: 2px;
        background: rgba(var(--loader-fg), 0.08);
        border-radius: 1px;
        overflow: hidden;
      }
      #boot-splash .bar::after {
        content: '';
        display: block;
        height: 100%;
        width: 40%;
        background: rgba(var(--loader-fg), 0.25);
        border-radius: 1px;
        animation: slide 1.1s ease-in-out infinite;
      }
      @keyframes slide {
        from {
          transform: translateX(-100%);
        }
        to {
          transform: translateX(350%);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        #boot-splash .logo-tile,
        #boot-splash .cursor-arrow,
        #boot-splash .dot-ring,
        #boot-splash .dot-ripple,
        #boot-splash .slogan span,
        #boot-splash .mark,
        #boot-splash .bar::after {
          animation: none;
        }
      }
    </style>
  </head>

  <body>
    <div id="app"></div>
    <div id="boot-splash">
      <div class="scene">
        <svg class="logo" viewBox="0 0 280 280" role="img" aria-label="点睛设计 logo">
          <rect class="logo-tile" width="280" height="280" rx="56" fill="#FFFFFF" />
          <g transform="translate(50, 50)">
            <path
              class="cursor-arrow"
              d="M27 27L27 153L68.4 111.6L104.4 171L126 158.4L90 99L140.4 99L27 27Z"
              fill="#0F172A"
            />
            <circle
              class="dot-ripple"
              cx="27"
              cy="27"
              r="23.4"
              fill="none"
              stroke="#22D3EE"
              stroke-width="2"
            />
            <g class="dot-ring">
              <circle cx="27" cy="27" r="23.4" fill="#22D3EE" />
              <circle cx="27" cy="27" r="9" fill="#FFFFFF" />
            </g>
          </g>
        </svg>
        <p class="slogan" aria-label="AI can't paint a true loong without YOU to dot the eyes.">
          <span style="animation-delay: 1.1s">AI</span>
          <span style="animation-delay: 1.17s">can't</span>
          <span style="animation-delay: 1.24s">paint</span>
          <span style="animation-delay: 1.31s">a</span>
          <span style="animation-delay: 1.38s">true</span>
          <span style="animation-delay: 1.45s">loong</span>
          <span style="animation-delay: 1.52s">without</span>
          <span class="you" style="animation-delay: 1.59s">YOU</span>
          <span style="animation-delay: 1.66s">to</span>
          <span style="animation-delay: 1.73s">dot</span>
          <span style="animation-delay: 1.8s">the</span>
          <span style="animation-delay: 1.87s">eyes.</span>
        </p>
        <p class="mark">点睛设计</p>
        <div class="bar"></div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
